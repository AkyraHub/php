name: _build-scan-push (reusable)

# Reusable workflow that:
#   1. Builds the image for linux/amd64 (loadable locally for Trivy scan)
#   2. Scans the image with Trivy (CRITICAL + HIGH, fixed-only = block)
#   3. Post-processes via .github/actions/trivy-postprocess:
#        - publishes results to GitHub Step Summary (no Code Scanning needed)
#        - uploads JSON/SARIF/table as workflow artifact (30 days retention)
#        - fails the job if any CRITICAL/HIGH found
#   4. On push/tag events: builds multi-arch (amd64 + arm64) and pushes to GHCR
#
# Build/scan/push stay coupled in a single job because they share:
#   - the Docker daemon (the scan image must be loaded locally)
#   - the buildx cache (amd64 layers from scan-build are reused by multi-arch push)
on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akyrahub/php

jobs:
  build-and-scan:
    name: Build + Trivy scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging scheme:
      # - push trunk: floating tags 8, 8.5, 8.5.5-alpine3.23
      # - tag v*.*.*: version tag + full discriminant
      # Never :latest (project decision).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-php8.5.5-alpine3.23
            type=raw,value=8,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') }}
            type=raw,value=8.5,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') }}
            type=raw,value=8.5.5-alpine3.23,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') }}
          labels: |
            org.opencontainers.image.title=php
            org.opencontainers.image.description=Minimal PHP-FPM base image for AkyraHub projects

      # Build single-arch (amd64) + load locally for Trivy scan.
      # This also validates the Dockerfile compiles. The cache it produces is
      # reused by the multi-arch push step (only arm64 layers are new there).
      - name: Build amd64 for scan + Dockerfile validation
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: php:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ github.ref_name }}

      # Trivy with exit-code: 0 so we collect the full report regardless of
      # findings; the trivy-postprocess composite action decides pass/fail
      # based on CRITICAL/HIGH count (jq).
      # ignore-unfixed: true → don't block on CVEs without an upstream patch.
      - name: Run Trivy (image, JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php:scan
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - uses: ./.github/actions/trivy-postprocess
        if: always()
        with:
          base-name: trivy-image
          scan-name: php base image scan
          artifact-name: trivy-image-reports

      # Push multi-arch image only after Trivy passes.
      # amd64 layers are already in cache from the scan build → only arm64 is new work.
      - name: Build and push multi-arch
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ github.ref_name }}

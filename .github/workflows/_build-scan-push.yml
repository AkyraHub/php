name: _build-scan-push (reusable)

# Reusable workflow that:
#   1. Builds the image for linux/amd64 (loadable locally for Trivy scan)
#   2. Scans the image with Trivy (CRITICAL + HIGH, fixed-only = block)
#   3. Post-processes via .github/actions/trivy-postprocess:
#        - publishes results to GitHub Step Summary (no Code Scanning needed)
#        - uploads JSON/SARIF/table as workflow artifact (30 days retention)
#        - fails the job if any CRITICAL/HIGH found
#   4. On publish events (trunk push, or a release via `release_version`):
#      re-uses the scan build (full cache hit) and pushes to GHCR
#
# amd64-only: FTDA prod runs on x86_64 / amd64, dev team is on Intel Mac (amd64).
# Adding arm64 would require either ~25min QEMU emulation per build or a paid
# arm64 runner. Not justified by the current target audience. Re-enable later
# when an arm64 consumer exists (Graviton migration, Apple Silicon dev share).
on:
  workflow_call:
    inputs:
      release_version:
        description: 'When set (vX.Y.Z), publish the version image tags instead of the floating trunk tags. Empty on normal trunk CI.'
        type: string
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akyrahub/php

jobs:
  build-and-scan:
    name: Build + Trivy scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the leading "v" from the release version (git tag v1.0.1 -> image 1.0.1).
      # Empty when not a release, which disables the version tags below.
      - name: Compute release image tag
        id: relver
        run: echo "clean=${RAW#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.release_version }}

      # Tagging scheme:
      # - release (release_version set): X.Y.Z + X.Y.Z-php8.5.5-alpine3.23
      # - push trunk (release_version empty): floating tags 8, 8.5, 8.5.5-alpine3.23
      # Never :latest (project decision).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.relver.outputs.clean }},enable=${{ inputs.release_version != '' }}
            type=raw,value=${{ steps.relver.outputs.clean }}-php8.5.5-alpine3.23,enable=${{ inputs.release_version != '' }}
            type=raw,value=8,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') && inputs.release_version == '' }}
            type=raw,value=8.5,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') && inputs.release_version == '' }}
            type=raw,value=8.5.5-alpine3.23,enable=${{ github.ref == format('refs/heads/{0}', 'trunk') && inputs.release_version == '' }}
          labels: |
            org.opencontainers.image.title=php
            org.opencontainers.image.description=Minimal PHP-FPM base image for AkyraHub projects

      # Build single-arch (amd64) + load locally for Trivy scan.
      # This also validates the Dockerfile compiles.
      #
      # Freshness policy (hybrid):
      #   - Pull requests   -> cached build (fast feedback; PR images are never published).
      #   - push / tag      -> no-cache, so the `RUN apk upgrade` layer is rebuilt and
      #                        transitive OS CVEs (e.g. openssl) are actually patched in
      #                        every published image. Without this, a cached apk-upgrade
      #                        layer can republish a stale (vulnerable) image.
      # The no-cache build exports fresh layers to the gha cache, which the push step
      # below then reuses (cache-from) for an essentially instant rebuild — so a publish
      # event compiles the PHP extensions only once.
      - name: Build amd64 for scan + Dockerfile validation
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: php:scan
          no-cache: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}

      # Trivy with exit-code: 0 so we collect the full report regardless of
      # findings; the trivy-postprocess composite action decides pass/fail
      # based on CRITICAL/HIGH count (jq).
      # ignore-unfixed: true → don't block on CVEs without an upstream patch.
      - name: Run Trivy (image, JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php:scan
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - uses: ./.github/actions/trivy-postprocess
        if: always()
        with:
          base-name: trivy-image
          scan-name: php base image scan
          artifact-name: trivy-image-reports

      # Push amd64 image only after Trivy passes.
      # All layers are in cache from the scan build → essentially instant rebuild.
      - name: Build and push amd64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
